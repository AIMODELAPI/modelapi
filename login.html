<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — ModelAPI | Intelligence, Orchestrated.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="modelapi-demo.css">
<script src="config.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" defer></script>
<style>
  .login-wrap{max-width:460px;margin:110px auto 80px;padding:0 20px}
  .login-card{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius-xl);padding:40px;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px rgba(76,201,255,.08)}
  .login-card h1{font-size:1.7rem;margin-bottom:6px}
  .login-sub{color:var(--muted);margin-bottom:26px;font-size:.95rem;line-height:1.6}
  #sign-in{margin-top:8px}
  .login-foot{text-align:center;margin-top:22px;color:var(--muted-2);font-size:.85rem}
  .login-foot a{color:var(--neon);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<header class="nav" id="navbar">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span class="brand-mark">◆</span> ModelAPI</a>
    <nav class="nav-links">
      <a href="index.html">首页</a><a href="pricing.html">定价</a>
      <a href="why-modelapi.html">为什么选 ModelAPI</a><a href="faq.html">FAQ</a>
    </nav>
    <a class="btn btn-primary" href="index.html">返回首页</a>
  </div>
</header>

<div class="login-wrap">
  <div class="login-card">
    <h1>登录 ModelAPI</h1>
    <p class="login-sub">Intelligence, Orchestrated.<br>登录后体验你的多模型 AI 编排控制台。</p>
    <div id="sign-in"><p style="color:var(--muted)">正在加载登录组件…</p></div>
    <p class="login-foot">还没有账号？<a href="#" id="signupLink">立即注册</a></p>
  </div>
</div>

<script>
  window.addEventListener('load', function () {
    var mount = document.getElementById('sign-in');
    if (!window.Clerk) {
      mount.innerHTML = '<p style="color:#ff6b6b">登录组件加载失败：请检查网络（Clerk CDN）。</p>';
      return;
    }
    var KEY = (window.APP_CONFIG && window.APP_CONFIG.CLERK_PUBLISHABLE_KEY) || '';
    if (!KEY || KEY.indexOf('REPLACE_') === 0) {
      mount.innerHTML = '<p style="color:#ffb84d">尚未配置 Clerk Key。<br>请在 config.js 填入你的 Publishable Key 后刷新本页。</p>';
      return;
    }
    Clerk.load({ publishableKey: KEY }).then(function () {
      if (Clerk.user) { window.location.href = 'index.html'; return; }
      var appearance = {
        variables: {
          colorPrimary: '#4cc9ff',
          colorBackground: '#12131d',
          colorText: '#e6edf3',
          colorInputBackground: '#0d0d18',
          colorInputText: '#e6edf3',
          colorDanger: '#ff6b6b'
        },
        layout: { socialButtonsVariant: 'iconButton' }
      };
      Clerk.mountSignIn(mount, { appearance: appearance });
      var su = document.getElementById('signupLink');
      if (su) su.addEventListener('click', function (e) {
        e.preventDefault();
        Clerk.mountSignUp(mount, { appearance: appearance });
      });
      Clerk.addListener(function (ev) { if (ev && ev.session) window.location.href = 'index.html'; });
    }).catch(function (e) {
      mount.innerHTML = '<p style="color:#ff6b6b">Clerk 加载失败：' + (e && e.message ? e.message : e) +
        '<br>请确认 Key 正确，且本域名已加入 Clerk 允许的 Origins。</p>';
    });
  });
</script>
</body>
</html>
