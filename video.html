<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 视频生成 — ModelAPI</title>
<meta name="description" content="ModelAPI AI 视频生成：输入一句话，用通义万相生成高质量视频。官方授权 AI 视频生成平台。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="modelapi-demo.css">
<style>
  .gen-wrap{max-width:880px;margin:60px auto 80px;padding:0 20px}
  .gen-head{text-align:center;margin-bottom:36px}
  .gen-head h1{font-size:2.1rem;font-weight:800;margin-bottom:10px;color:var(--text)}
  .gen-head h1 .accent{color:var(--neon)}
  .gen-head p{color:var(--muted);font-size:1.02rem;line-height:1.7;max-width:640px;margin:0 auto}

  .gen-card{
    background:var(--surface);border:1px solid var(--border-2);
    border-radius:var(--radius-xl);padding:32px 30px;
    box-shadow:0 24px 64px rgba(0,0,0,.55),0 0 48px rgba(76,201,255,.06);
    position:relative;overflow:hidden;
  }
  .gen-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--neon),var(--purple),var(--green))}

  .field{margin-bottom:20px}
  .field label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:8px;letter-spacing:.3px}
  .field textarea{
    width:100%;padding:14px 16px;border-radius:var(--radius-md);
    background:#0d0d18;border:1px solid var(--border);color:var(--text);
    font-size:1rem;font-family:'Inter',sans-serif;outline:none;resize:vertical;
    min-height:100px;box-sizing:border-box;transition:border-color .2s,box-shadow .2s;line-height:1.6;
  }
  .field textarea:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(76,201,255,.15)}
  .field textarea::placeholder{color:#555}

  .opts{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
  .opt-btn{
    padding:10px 18px;border-radius:var(--radius-md);background:#161625;
    border:1px solid var(--border);color:#ccc;font-size:.9rem;font-weight:600;
    cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;
  }
  .opt-btn:hover{background:#1e1e36;color:#fff;border-color:var(--neon)}
  .opt-btn.active{background:rgba(76,201,255,.12);color:var(--neon);border-color:var(--neon)}

  .btn-gen{
    width:100%;padding:15px;border-radius:var(--radius-lg);
    background:linear-gradient(135deg,var(--neon),#3aa0e0);color:#fff;
    font-size:1.08rem;font-weight:700;border:none;cursor:pointer;
    transition:transform .15s,box-shadow .2s;letter-spacing:.5px;
  }
  .btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(76,201,255,.35)}
  .btn-gen:active{transform:scale(.98)}
  .btn-gen:disabled{opacity:.6;cursor:not-allowed;transform:none}

  .gen-error{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.25);
    color:#ff8888;padding:12px 14px;border-radius:var(--radius-md);font-size:.88rem;
    margin-top:18px;display:none;word-break:break-all}

  .result{margin-top:26px;display:none}
  .result.show{display:block}
  .result-video{width:100%;border-radius:var(--radius-lg);border:1px solid var(--border-2);display:block;background:#000}
  .result-hint{color:var(--muted-2);font-size:.82rem;margin-top:10px;text-align:center}

  .demo-note{background:rgba(250,238,218,.06);border:1px solid rgba(239,159,39,.3);
    color:#f0c06a;padding:12px 14px;border-radius:var(--radius-md);font-size:.88rem;margin-top:18px;display:none;line-height:1.6}

  .loading{text-align:center;color:var(--muted);margin-top:20px;display:none;font-size:.95rem}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(76,201,255,.25);
    border-top-color:var(--neon);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="nav" id="navbar">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span class="brand-mark">◆</span> ModelAPI</a>
    <nav class="nav-links">
      <a href="index.html">首页</a>
      <a href="image.html">AI 生图</a>
      <a href="video.html">AI 视频</a>
    </nav>
    <a class="btn btn-primary" href="login.html">免费开始</a>
  </div>
</header>

<div class="gen-wrap">
  <div class="gen-head">
    <h1>一句话，<span class="accent">生成一段视频</span></h1>
    <p>输入你的想法，通义万相 Wan 2.7 帮你把它变成动态画面。官方授权 AI 视频生成平台，合规、稳定。</p>
  </div>

  <div class="gen-card">
    <div class="field">
      <label for="prompt">描述你想生成的画面</label>
      <textarea id="prompt" placeholder="例如：一只橘猫在海边散步，夕阳，电影感镜头，慢动作"></textarea>
    </div>

    <div class="field">
      <label>视频时长</label>
      <div class="opts" id="durationOpts">
        <button type="button" class="opt-btn" data-duration="3">3 秒</button>
        <button type="button" class="opt-btn active" data-duration="5">5 秒</button>
        <button type="button" class="opt-btn" data-duration="10">10 秒</button>
      </div>
    </div>

    <div class="field">
      <label>清晰度</label>
      <div class="opts" id="resOpts">
        <button type="button" class="opt-btn" data-res="480p">480P</button>
        <button type="button" class="opt-btn active" data-res="720p">720P</button>
      </div>
    </div>

    <button class="btn-gen" id="genBtn">生 成 视 频</button>

    <div class="loading" id="loading"><span class="spinner"></span>正在生成，通常需要 1~3 分钟…</div>
    <div class="gen-error" id="genError"></div>
    <div class="demo-note" id="demoNote"></div>

    <div class="result" id="result">
      <video class="result-video" id="resultVideo" controls playsinline></video>
      <p class="result-hint">由通义万相 Wan 2.7 生成</p>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="footer-bottom">© 2026 ModelAPI · AI 生图与视频生成平台 · 由 aimodelapi.ai 提供底层 AI 能力</div>
  <div class="legal-bar"><a href="privacy.html">隐私政策 Privacy</a> · <a href="terms.html">服务条款 Terms</a> · <a href="refund.html">退款政策 Refund</a> · <a href="pricing.html">定价 Pricing</a> · <a href="about.html">关于我们 About</a> · <a href="contact.html">联系我们 Contact</a></div>
</footer>

<script>
(function () {
  var promptEl = document.getElementById('prompt');
  var genBtn = document.getElementById('genBtn');
  var loadingEl = document.getElementById('loading');
  var errorEl = document.getElementById('genError');
  var demoEl = document.getElementById('demoNote');
  var resultEl = document.getElementById('result');
  var resultVideo = document.getElementById('resultVideo');
  var currentDuration = 5;
  var currentRes = '720p';

  document.getElementById('durationOpts').addEventListener('click', function (e) {
    var btn = e.target.closest('.opt-btn'); if (!btn) return;
    document.querySelectorAll('#durationOpts .opt-btn').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active'); currentDuration = parseInt(btn.getAttribute('data-duration'), 10);
  });
  document.getElementById('resOpts').addEventListener('click', function (e) {
    var btn = e.target.closest('.opt-btn'); if (!btn) return;
    document.querySelectorAll('#resOpts .opt-btn').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active'); currentRes = btn.getAttribute('data-res');
  });

  function showError(msg) { errorEl.textContent = msg; errorEl.style.display = 'block'; }
  function hideAll() { errorEl.style.display = 'none'; demoEl.style.display = 'none'; resultEl.classList.remove('show'); }

  genBtn.addEventListener('click', function () {
    var prompt = promptEl.value.trim();
    if (!prompt) { showError('请先输入你想生成的画面描述'); return; }
    hideAll();
    genBtn.disabled = true; genBtn.textContent = '生成中…'; loadingEl.style.display = 'block';

    fetch('/api/video', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: prompt, duration: currentDuration, resolution: currentRes })
    })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, data: j }; }); })
    .then(function (res) {
      loadingEl.style.display = 'none'; genBtn.disabled = false; genBtn.textContent = '生 成 视 频';
      if (res.data && res.data.pending) { demoEl.textContent = res.data.message; demoEl.style.display = 'block'; return; }
      if (res.data && res.data.error) { showError('生成失败：' + res.data.error + (res.data.detail ? '（' + res.data.detail + '）' : '')); return; }
      var url = res.data && res.data.data && res.data.data[0] && (res.data.data[0].url || res.data.data[0].video_url);
      if (url) { resultVideo.src = url; resultEl.classList.add('show'); } else { showError('未获取到视频结果，请稍后重试'); }
    })
    .catch(function (err) {
      loadingEl.style.display = 'none'; genBtn.disabled = false; genBtn.textContent = '生 成 视 频';
      showError('网络错误：' + err.message);
    });
  });
})();
</script>

</body>
</html>
